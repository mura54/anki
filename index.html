<style>
/* layout: 1 column app — library → drill → result, one card-free sheet at a time */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --fg:#1d2420; --mute:#6b766f; --line:#dde2dc;
  --accent:#1f7a5c; --accent-ink:#ffffff; --accent-soft:#e3f1ea;
  --ok:#1f7a5c; --ng:#c2412d; --ng-soft:#fbe9e5;
  --f-body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --f-num:"Space Grotesk","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --fg:#e7ece8; --mute:#8f9a93; --line:#2b332f;
  --accent:#4cc495; --accent-ink:#0d1a14; --accent-soft:#1d3329;
  --ok:#4cc495; --ng:#f07a63; --ng-soft:#3a201b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --fg:#e7ece8; --mute:#8f9a93; --line:#2b332f;
  --accent:#4cc495; --accent-ink:#0d1a14; --accent-soft:#1d3329;
  --ok:#4cc495; --ng:#f07a63; --ng-soft:#3a201b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-num);font-weight:700;font-size:22px;letter-spacing:.02em}
h2{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute);margin:0}
section{display:flex;flex-direction:column;gap:10px}

/* library */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.book{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px 12px;min-width:0}
.book[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.book .n{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--accent)}
.book .t{font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.book .bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.book .bar i{display:block;height:100%;background:var(--accent)}
.book .x{position:absolute;top:4px;right:4px;border:0;background:none;padding:2px 6px;color:var(--mute);font-size:16px;line-height:1}
.unit{display:flex;flex-direction:column;gap:8px}
.unit + .unit{margin-top:6px}
.unit h3{margin:0;font-size:12px;font-weight:500;color:var(--mute)}
.unit h3 button{border:0;background:none;padding:0;color:inherit;font-size:inherit}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:10px;padding:14px;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:7px 12px;background:transparent}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.opts{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
.opts > span{font-size:13px;color:var(--mute)}
.opts .row{display:flex;flex-wrap:wrap;gap:8px}
.start{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.start button{width:100%;padding:14px;font-size:16px}
.toast{min-height:1.4em;font-size:13px;color:var(--mute)}

/* drill */
.drill{min-height:100%;display:flex;flex-direction:column;gap:20px}
.prog{display:flex;align-items:center;gap:12px}
.prog .track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-size:21px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.q small{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.media a{color:var(--accent);font-size:13px;word-break:break-all}
.answer{display:flex;flex-direction:column;gap:10px}
.answer input[type=text]{width:100%;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.answer input[type=text].ok{border-color:var(--ok)}
.answer input[type=text].ng{border-color:var(--ng)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;font-size:16px}
.choice kbd{font-family:var(--f-num);font-size:12px;color:var(--mute);min-width:1em;padding-top:3px}
.choice[aria-pressed="true"]{border-color:var(--fg)}
.choice.ok{border-color:var(--ok);background:var(--accent-soft)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line)}
.fb.ok{border-color:var(--ok)}
.fb.ng{border-color:var(--ng)}
.fb .mark{font-family:var(--f-num);font-weight:700;font-size:20px}
.fb.ok .mark{color:var(--ok)} .fb.ng .mark{color:var(--ng)}
.fb .correct{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.fb .alt{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.fb .exp{font-size:14px;color:var(--mute);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .primary{flex:1;min-width:140px;padding:12px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.judge button{padding:14px;font-size:18px;font-family:var(--f-num);font-weight:700}
.judge .o{color:var(--ok);border-color:var(--ok)}
.judge .x{color:var(--ng);border-color:var(--ng)}

/* result */
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-family:var(--f-num);font-size:56px;line-height:1}
.score span{color:var(--mute)}
.misses{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.miss{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.miss > *{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.miss .a{color:var(--ok)}
@media (max-width:480px){.q{font-size:19px}.miss{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- storage ---------- */
const KEY = 'hafal.v1';

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const d = first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"' && f === '') q = true;
    else if (c === d){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function splitEsc(s, sep){
  const out = []; let cur = '';
  for (let i = 0; i < (s||'').length; i++){
    const c = s[i];
    if (c === '\\' && (s[i+1] === ';' || s[i+1] === '|' || s[i+1] === '\\')){ cur += s[i+1]; i++; }
    else if (c === sep){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(x => x !== '');
}
/* split answers: ';' elements, each with '|' alternatives — escape-aware on both levels */
function splitAnswers(s){
  const els = []; let cur = '';
  for (let i = 0; i < (s||'').length; i++){
    const c = s[i];
    if (c === '\\' && s[i+1]){ cur += c + s[i+1]; i++; }
    else if (c === ';'){ els.push(cur); cur = ''; }
    else cur += c;
  }
  els.push(cur);
  return els.map(e => splitEsc(e, '|')).filter(a => a.length);
}
function toItems(text){
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().replace(/^﻿/, ''));
  const hasHead = head.some(h => /^question$/i.test(h));
  const idx = n => head.findIndex(h => h.toLowerCase() === n.toLowerCase());
  const col = hasHead
    ? { q:idx('question'), a:idx('answers'), w:idx('wrongChoices'), g:idx('generatedWrongChoices'), e:idx('explanation'), t:idx('tags'), y:idx('type'), o:idx('ordered') }
    : { q:0, a:1, e:2, w:-1, g:-1, t:-1, y:-1, o:-1 };
  const get = (r, i) => i >= 0 ? (r[i] || '').trim() : '';
  return rows.slice(hasHead ? 1 : 0).map(r => {
    const qparts = splitEsc(get(r, col.q), '|');
    const answers = hasHead ? splitAnswers(get(r, col.a)) : [[get(r, col.a)].filter(Boolean)];
    const wrong = splitEsc(get(r, col.w), ';');
    const gen = parseInt(get(r, col.g)) || 0;
    let type = get(r, col.y);
    if (!type) type = (wrong.length || gen) ? (answers.length > 1 ? 'selectComplete' : 'select') : (answers.length > 1 ? 'complete' : 'write');
    const eparts = splitEsc(get(r, col.e), '|');
    return {
      q: qparts[0] || '', qmedia: qparts.slice(1),
      a: answers, wrong, gen, type,
      ordered: get(r, col.o) === '1',
      e: eparts[0] || '', emedia: eparts.slice(1),
      tags: splitEsc(get(r, col.t), ';'),
    };
  }).filter(it => it.q && it.a.length);
}

const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'class') el.className = v;
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach(k => k != null && el.append(k.nodeType ? k : document.createTextNode(k)));
  return el;
};

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isLatin = s => /^[\x00-ɏ\s“”’—–]+$/.test(s);

  }}}, '×'));

async function importFiles(files){
  let added = 0, rows = 0;
  for (const f of files){

    const id = 'u:' + f.name;
    lib[id] = store.books[id] = { id, name:f.name.replace(/\.(csv|tsv|txt)$/i, ''), text };
    delete itemCache[id];
    if (!store.sel.includes(id)) store.sel.push(id);
    added++; rows += its.length;
  }
  if (added) toastMsg = `${added}ファイル・${rows}問を追加しました`;
  save(); renderLib();
}
function seg(key, pairs){
  return $('div', { class:'seg', role:'group' }, pairs.map(([v, label]) =>
    $('button', { 'aria-pressed': String(opt[key] === v), on:{ click(){ opt[key] = v; store.opt = opt; save(); renderLib(); } } }, label)));
}
function renderLib(){
  keyHandler = null;
  app.replaceChildren();
  app.append($('header', { class:'top' }, $('span', { class:'brand' }, 'Hafal'),
    store.sel.length ? $('button', { class:'ghost', on:{ click(){ store.sel = []; save(); renderLib(); } } }, '選択を解除') : null));

  const built = Object.values(lib).filter(b => b.builtin);
  const mine = Object.values(lib).filter(b => !b.builtin);
  const libSec = $('section');
  UNITS.forEach(([a, z, name], i) => {
    const ids = built.filter(b => b.n >= a && b.n <= z).map(b => b.id);
    const all = ids.every(id => store.sel.includes(id));
    libSec.append($('div', { class:'unit' },
      $('h3', {}, $('button', { on:{ click(){
        store.sel = all ? store.sel.filter(x => !ids.includes(x)) : [...new Set([...store.sel, ...ids])]; save(); renderLib();
      }}}, `単元${i + 1}　${name}`)),
      $('div', { class:'books' }, built.filter(b => b.n >= a && b.n <= z).map(bookBtn))));
  });
  if (mine.length) libSec.append($('div', { class:'unit' }, $('h3', {}, '読み込んだCSV'), $('div', { class:'books' }, mine.map(bookBtn))));

  const file = $('input', { type:'file', id:'file', accept:'.csv,.tsv,.txt,text/csv', multiple:true, on:{ change(e){ importFiles([...e.target.files]); } } });
  const drop = $('label', { class:'drop', for:'file' }, file, 'CSVを読み込む');
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
  drop.addEventListener('drop', e => { e.preventDefault(); importFiles([...e.dataTransfer.files]); });
  libSec.append(drop, $('div', { class:'toast', role:'status' }, toastMsg));
  app.append(libSec);

  const tagSet = [...new Set(store.sel.flatMap(id => items(id).flatMap(it => it.tags)))]
    .filter(t => !/^第\d+課$/.test(t) || store.sel.length > 1).sort();
  opt.tags = opt.tags.filter(t => tagSet.includes(t));
  const opts = $('div', { class:'opts' });
  if (tagSet.length){
    opts.append($('span', {}, 'タグ'), $('div', { class:'chips' }, tagSet.map(t => {
      const on = opt.tags.includes(t);
      return $('button', { class:'chip', 'aria-pressed': String(on), on:{ click(){
        opt.tags = on ? opt.tags.filter(x => x !== t) : [...opt.tags, t]; store.opt = opt; save(); renderLib();
      }}}, t);
    })));
  }
  opts.append(
    $('span', {}, '解き方'), $('div', { class:'row' }, seg('mode', [['as', 'そのまま'], ['choice', '4択'], ['self', '自己採点']])),
    $('span', {}, '範囲'), $('div', { class:'row' }, seg('range', [['all', 'すべて'], ['miss', '間違えた問題'], ['new', '未出題']])),
    $('span', {}, '問題数'), $('div', { class:'row' }, seg('count', [[10, '10'], [20, '20'], [50, '50'], [0, '全部']])),
    $('span', {}, '出題'), $('div', { class:'row' },
      seg('shuffle', [[true, 'シャッフル'], [false, '順番どおり']]),
      seg('swap', [[false, '問題→答え'], [true, '答え→問題']])));
  app.append($('section', {}, opts));

  const pool = selectedPool();
  const n = opt.count ? Math.min(opt.count, pool.length) : pool.length;
  app.append($('div', { class:'start' }, $('button', { class:'primary', disabled: !n, on:{ click(){ startDrill(pool); } } },
    n ? `${n}問を解く` : (store.sel.length ? '該当する問題がありません' : '問題集を選んでください'))));
}

/* ---------- drill ---------- */
let S = null;
function startDrill(pool, isRetry){
  let list = opt.shuffle ? shuffle(pool) : pool.slice();
  if (!isRetry && opt.count) list = list.slice(0, opt.count);
  list = list.map(it => prepare(it, pool));
  S = { list, i:0, results:[], pool };
  renderQ();
}
function prepare(it, pool){
  let q = { ...it, a: it.a.map(x => x.slice()) };
  const swappable = q.type === 'write' && !q.q.includes('\n');
  if (opt.swap && swappable){ const nq = q.a[0][0]; q.a = [[q.q]]; q.q = nq; }
  if (opt.mode === 'self') q.mode = 'self';
  else if ((q.type === 'select' || q.type === 'selectComplete')) q.mode = q.type;
  else if (opt.mode === 'choice' && q.type === 'write') q.mode = 'select';
  else q.mode = q.type;
  if (q.mode === 'select' || q.mode === 'selectComplete'){
    let wrong = q.wrong.slice();
    const need = q.gen || (wrong.length ? 0 : 3);
    if (need){
      const target = q.a[0][0];
      const cands = shuffle([...new Set(pool.filter(p => p.type === 'write').map(p =>
        (opt.swap && !p.q.includes('\n')) ? p.q : p.a[0][0]))])
        .filter(c => norm(c) !== norm(target) && isLatin(c) === isLatin(target) && !wrong.includes(c));
      wrong = wrong.concat(cands.slice(0, need));
    }
    const right = q.a.map(x => x[0]);
    q.options = shuffle([...right.map(t => ({ t, ok:true })), ...wrong.map(t => ({ t, ok:false }))]);
  }
  return q;
}
function header(){
  const done = S.i, total = S.list.length;
  return $('div', { class:'prog' },
    $('button', { class:'ghost', 'aria-label':'やめる', on:{ click: renderLib } }, '×'),
    $('div', { class:'track' }, $('i', { style:`width:${done / total * 100}%` })),
    $('span', { class:'num' }, `${done + 1} / ${total}`));
}
function qBlock(q){
  const lines = q.q.split('\n');
  const block = $('p', { class:'q' });
  block.append(lines.join('\n'));
  const media = q.qmedia.length ? $('div', { class:'media' }, q.qmedia.map(u => $('a', { href:u, target:'_blank', rel:'noopener' }, u))) : null;
  return [block, media];
}
function renderQ(){
  const q = S.list[S.i];
  app.replaceChildren();
  const box = $('div', { class:'drill' }, header(), ...qBlock(q));
  const ans = $('div', { class:'answer' });
  box.append(ans);
  app.append(box);
  ({ write:askWrite, complete:askComplete, select:askSelect, selectComplete:askSelectComplete, self:askSelf }[q.mode] || askWrite)(q, ans);
}
function matchOne(input, alts){ const n = norm(input); return alts.some(a => norm(a) === n); }
function askWrite(q, ans){
  const inp = $('input', { type:'text', id:'ans', autocomplete:'off', autocapitalize:'off', spellcheck:'false', enterkeyhint:'done' });
  const go = $('button', { class:'primary', on:{ click: submit } }, '答える');
  ans.append(inp, $('div', { class:'acts' }, go, $('button', { on:{ click(){ inp.value = ''; submit(); } } }, 'わからない')));
  inp.focus();
  keyHandler = e => { if (e.key === 'Enter' && !e.isComposing && document.activeElement === inp){ e.preventDefault(); submit(); } };
  function submit(){
    const ok = inp.value.trim() !== '' && matchOne(inp.value, q.a[0]);
    inp.disabled = true; inp.classList.add(ok ? 'ok' : 'ng');
    ans.querySelector('.acts').remove();
    feedback(q, ans, ok, { given: inp.value, overridable: !ok && inp.value.trim() !== '' });
  }
}
function askComplete(q, ans){
  const inps = q.a.map((_, i) => $('input', { type:'text', id:'ans' + i, autocomplete:'off', autocapitalize:'off', spellcheck:'false', placeholder: q.ordered ? String(i + 1) : '' }));
  ans.append(...inps, $('div', { class:'acts' }, $('button', { class:'primary', on:{ click: submit } }, '答える')));
  inps[0].focus();
  keyHandler = e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const k = inps.indexOf(document.activeElement);
    if (k < 0) return;
    e.preventDefault();
    if (k < inps.length - 1) inps[k + 1].focus(); else submit();
  };
  function submit(){
    const vals = inps.map(i => i.value);
    let ok;
    if (q.ordered) ok = q.a.every((alts, i) => matchOne(vals[i], alts));
    else { const rest = q.a.slice(); ok = vals.every(v => { const k = rest.findIndex(alts => matchOne(v, alts)); if (k < 0) return false; rest.splice(k, 1); return true; }); }
    inps.forEach(i => { i.disabled = true; i.classList.add(ok ? 'ok' : 'ng'); });
    ans.querySelector('.acts').remove();
    feedback(q, ans, ok, {});
  }
}
function choiceButtons(q, ans, multi, onPick){
  const wrap = $('div', { class:'choices' });
  const btns = q.options.map((o, i) => $('button', { class:'choice', 'aria-pressed':'false', on:{ click(){ onPick(i, btns); } } },
    $('kbd', {}, i < 9 ? String(i + 1) : ''), $('span', {}, o.t)));
  wrap.append(...btns);
  ans.append(wrap);
  return btns;
}
function askSelect(q, ans){
  let done = false;
  const btns = choiceButtons(q, ans, false, (i, bs) => {
    if (done) return; done = true;
    const ok = q.options[i].ok;
    bs.forEach((b, k) => { if (q.options[k].ok) b.classList.add('ok'); else if (k === i) b.classList.add('ng'); b.disabled = !q.options[k].ok && k !== i; });
    feedback(q, ans, ok, { hideCorrect: true });
  });
  keyHandler = e => { const k = parseInt(e.key) - 1; if (!done && k >= 0 && k < btns.length){ e.preventDefault(); btns[k].click(); } };
}
function askSelectComplete(q, ans){
  const picked = new Set(); let done = false;
  const btns = choiceButtons(q, ans, true, (i, bs) => {
    if (done) return;
    picked.has(i) ? picked.delete(i) : picked.add(i);
    bs[i].setAttribute('aria-pressed', String(picked.has(i)));
  });
  const acts = $('div', { class:'acts' }, $('button', { class:'primary', on:{ click: submit } }, '答える'));
  ans.append(acts);
  keyHandler = e => {
    const k = parseInt(e.key) - 1;
    if (!done && k >= 0 && k < btns.length){ e.preventDefault(); btns[k].click(); }
    else if (!done && e.key === 'Enter'){ e.preventDefault(); submit(); }
  };
  function submit(){
    done = true; acts.remove();
    const ok = q.options.every((o, k) => o.ok === picked.has(k));
    btns.forEach((b, k) => { b.disabled = true; if (q.options[k].ok) b.classList.add('ok'); else if (picked.has(k)) b.classList.add('ng'); });
    feedback(q, ans, ok, { hideCorrect: true });
  }
}
function askSelf(q, ans){
  const show = $('button', { class:'primary', on:{ click: reveal } }, '答えを見る');
  ans.append($('div', { class:'acts' }, show));
  show.focus();
  keyHandler = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); reveal(); } };
  function reveal(){
    ans.replaceChildren(correctBox(q, null));
    const judge = $('div', { class:'judge' },
      $('button', { class:'o', on:{ click(){ record(q, true); next(); } } }, '○'),
      $('button', { class:'x', on:{ click(){ record(q, false); next(); } } }, '×'));
    ans.append(judge);
    keyHandler = e => {
      if (e.key === '1' || e.key === 'ArrowLeft' || e.key.toLowerCase() === 'o'){ e.preventDefault(); record(q, true); next(); }
      if (e.key === '2' || e.key === 'ArrowRight' || e.key.toLowerCase() === 'x'){ e.preventDefault(); record(q, false); next(); }
    };
  }
}
function correctBox(q, ok, opts = {}){
  const fb = $('div', { class:'fb' + (ok === true ? ' ok' : ok === false ? ' ng' : '') });
  if (ok !== null) fb.append($('span', { class:'mark' }, ok ? '○' : '×'));
  if (!opts.hideCorrect || ok === false || ok === null){
    if (!(opts.hideCorrect && (q.mode === 'select' || q.mode === 'selectComplete'))){
      fb.append($('div', { class:'correct' }, q.a.map(x => x[0]).join(q.ordered ? ' → ' : '\n')));
      const alts = q.a.flatMap(x => x.slice(1)).filter(a => !q.a.some(x => x[0] === a));
      const shown = [...new Set(alts.filter(a => norm(a) !== norm(q.a[0][0])))];
      if (shown.length) fb.append($('div', { class:'alt' }, shown.join('　/　')));
    }
  }
  if (q.e || q.emedia.length) fb.append($('div', { class:'exp' }, q.e, ...q.emedia.map(u => $('a', { href:u, target:'_blank', rel:'noopener' }, ' ' + u))));
  return fb;
}
function feedback(q, ans, ok, opts){
  record(q, ok);
  const fb = correctBox(q, ok, opts);
  const nextBtn = $('button', { class:'primary', on:{ click: next } }, S.i + 1 < S.list.length ? '次へ' : '結果を見る');
  const acts = $('div', { class:'acts' }, nextBtn);
  if (opts.overridable) acts.append($('button', { on:{ click(e){
    S.results[S.results.length - 1].ok = true; setStat(q, true);
    fb.className = 'fb ok'; fb.querySelector('.mark').textContent = '○';
    ans.querySelector('input')?.classList.replace('ng', 'ok');
    e.currentTarget.remove(); nextBtn.focus();
  }}}, '正解にする'));
  ans.append(fb, acts);
  nextBtn.focus();
  keyHandler = e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); next(); } };
}
function setStat(q, ok){
  const s = store.stats[q.key] || { c:0, w:0 };
  if (s._pending){ ok ? (s.c++, s.w--) : (s.w++, s.c--); }
  else { ok ? s.c++ : s.w++; s._pending = true; }
  s.last = ok ? 1 : 0;
  store.stats[q.key] = s;
}
function record(q, ok){
  S.results.push({ q, ok });
  setStat(q, ok);
}
function next(){
  const s = store.stats[S.list[S.i].key]; if (s) delete s._pending;
  save();
  S.i++;
  if (S.i < S.list.length) renderQ(); else renderResult();
}

/* ---------- result ---------- */
function renderResult(){
  const total = S.results.length, good = S.results.filter(r => r.ok).length;
  const miss = S.results.filter(r => !r.ok);
  app.replaceChildren();
  app.append($('header', { class:'top' }, $('span', { class:'brand' }, 'Hafal')));
  app.append($('section', {}, $('div', { class:'score' }, $('b', {}, `${Math.round(good / total * 100)}%`), $('span', { class:'num' }, `${good} / ${total}`))));
  const acts = $('div', { class:'acts' });
  if (miss.length) acts.append($('button', { class:'primary', on:{ click(){
    const keys = new Set(miss.map(r => r.q.key));
    startDrill(S.pool.filter(it => keys.has(it.key)), true);
  }}}, `間違えた${miss.length}問をもう一度`));
  acts.append($('button', { class: miss.length ? '' : 'primary', on:{ click: renderLib } }, '問題集にもどる'));
  app.append(acts);
  if (miss.length){
    app.append($('section', {}, $('h2', {}, '間違えた問題'),
      $('div', { class:'misses' }, miss.map(r => $('div', { class:'miss' }, $('div', {}, r.q.q), $('div', { class:'a' }, r.q.a.map(x => x[0]).join(' / ')))))));
  }
  keyHandler = e => { if (e.key === 'Enter'){ e.preventDefault(); acts.querySelector('button').click(); } };
}

renderLib();
</script>
